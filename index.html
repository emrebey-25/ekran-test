<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ekran Uyumluluk Testi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #0b1f3a; color: #ffffff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
#orta { position: absolute; left: 0; top: 0; width: 72%; height: 82%; background: #12305c; overflow: hidden; }
#sag { position: absolute; left: 72%; top: 0; width: 28%; height: 82%; background: #0b1f3a; border-left: 4px solid #f58220; overflow: hidden; }
#alt { position: absolute; left: 0; top: 82%; width: 100%; height: 18%; background: #f58220; color: #0b1f3a; overflow: hidden; }
.pad { padding: 1.5% 2%; }
h1 { font-size: 4.2vh; margin: 0 0 1vh 0; color: #ffd27a; }
.durum { font-size: 3.2vh; margin: 0.6vh 0; }
.t { display: inline-block; width: 46%; margin: 0.4% 1%; padding: 0.6vh 1%; font-size: 2.3vh; }
.ok { background: #1f7a3d; }
.yok { background: #a02727; }
#ua { font-size: 2vh; word-wrap: break-word; color: #cfe3ff; margin-top: 1vh; }
#saat { font-size: 9vh; font-weight: bold; text-align: center; margin-top: 3vh; }
#tarih { font-size: 3vh; text-align: center; color: #ffd27a; }
#cozunurluk { font-size: 2.4vh; text-align: center; margin-top: 3vh; color: #cfe3ff; }
#kayanKutu { position: absolute; left: 0; top: 30%; width: 100%; height: 40%; overflow: hidden; }
#kayan { position: absolute; top: 0; left: 0; white-space: nowrap; font-size: 7vh; font-weight: bold; }
#altBaslik { font-size: 2.6vh; position: absolute; left: 2%; top: 4%; }
</style>
</head>
<body>

<div id="orta">
  <div class="pad">
    <h1>EKRAN UYUMLULUK TESTİ</h1>
    <div class="durum">1) HTML yüklendi: <b style="color:#5dff8a">EVET</b></div>
    <div class="durum" id="js">2) JavaScript: <b style="color:#ff7b7b">ÇALIŞMIYOR</b></div>
    <div id="testler"></div>
    <div id="ua"></div>
  </div>
</div>

<div id="sag">
  <div class="pad">
    <div id="saat">--:--:--</div>
    <div id="tarih"></div>
    <div id="cozunurluk"></div>
  </div>
</div>

<div id="alt">
  <div id="altBaslik">Kayan yazı testi (akıcı ve kesintisiz kayması gerekir)</div>
  <div id="kayanKutu"><div id="kayan">EKRAN TESTİ - KAYAN YAZI ÇALIŞIYOR</div></div>
</div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function yaz(el, metin) {
    if (el.textContent !== undefined) { el.textContent = metin; } else { el.innerText = metin; }
  }

  $('js').innerHTML = '2) JavaScript: <b style="color:#5dff8a">ÇALIŞIYOR</b>';

  var gunler = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  var aylar = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function saatGuncelle() {
    var d = new Date();
    yaz($('saat'), pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()));
    yaz($('tarih'), d.getDate() + ' ' + aylar[d.getMonth()] + ' ' + d.getFullYear() + ' ' + gunler[d.getDay()]);
  }
  saatGuncelle();
  setInterval(saatGuncelle, 1000);

  var sonuc = [];
  function dene(ad, fn) {
    var ok = false;
    try { ok = !!fn(); } catch (e) { ok = false; }
    sonuc.push('<div class="t ' + (ok ? 'ok' : 'yok') + '">' + ad + ': ' + (ok ? 'VAR' : 'YOK') + '</div>');
  }
  function cssDestek(ozellik, deger) {
    var s = document.createElement('div').style;
    s[ozellik] = deger;
    return s[ozellik] === deger;
  }

  dene('ES6 (let, const, ok fonksiyonu, şablon)', function () {
    return new Function('"use strict"; let a = 1; const b = () => a + 1; return `${b()}` === "2";')();
  });
  dene('ES2017 async/await', function () {
    new Function('async function f() { await 1; }');
    return true;
  });
  dene('ES2020 ?. ve ?? işleçleri', function () {
    return new Function('var o = {}; return (o?.x ?? 5) === 5;')();
  });
  dene('Promise', function () { return typeof Promise !== 'undefined'; });
  dene('fetch', function () { return typeof fetch === 'function'; });
  dene('WebSocket', function () { return typeof WebSocket !== 'undefined'; });
  dene('EventSource (canlı güncelleme)', function () { return typeof EventSource !== 'undefined'; });
  dene('localStorage', function () {
    localStorage.setItem('t', '1');
    localStorage.removeItem('t');
    return true;
  });
  dene('CSS Flexbox', function () { return cssDestek('display', 'flex'); });
  dene('CSS Grid', function () { return cssDestek('display', 'grid'); });
  dene('CSS değişkenleri', function () {
    return window.CSS && CSS.supports && CSS.supports('color', 'var(--a)');
  });
  dene('Video H.264 (mp4)', function () {
    var v = document.createElement('video');
    return v.canPlayType && v.canPlayType('video/mp4; codecs="avc1.42E01E"') !== '';
  });
  dene('requestAnimationFrame', function () { return typeof requestAnimationFrame === 'function'; });
  dene('Tam ekran API', function () {
    var e = document.documentElement;
    return !!(e.requestFullscreen || e.webkitRequestFullscreen);
  });

  $('testler').innerHTML = sonuc.join('');
  yaz($('ua'), 'Tarayıcı kimliği: ' + navigator.userAgent);
  yaz($('cozunurluk'), 'Pencere: ' + window.innerWidth + ' x ' + window.innerHeight + ' | Ekran: ' + screen.width + ' x ' + screen.height);

  var kayan = $('kayan');
  var x = window.innerWidth;
  setInterval(function () {
    x -= 4;
    if (x < -kayan.offsetWidth) { x = window.innerWidth; }
    kayan.style.left = x + 'px';
  }, 30);
})();
</script>

</body>
</html>
